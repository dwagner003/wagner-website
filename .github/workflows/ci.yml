name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          JS_SIZE=$(du -sk dist/assets/*.js | awk '{sum+=$1} END {print sum}')
          CSS_SIZE=$(du -sk dist/assets/*.css | awk '{sum+=$1} END {print sum}')
          TOTAL_SIZE=$((JS_SIZE + CSS_SIZE))

          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript | ${JS_SIZE}KB |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS | ${CSS_SIZE}KB |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **${TOTAL_SIZE}KB** |" >> $GITHUB_STEP_SUMMARY

          # Fail if JS bundle exceeds 650KB (includes Supabase SDK + Leaflet map)
          if [ "$JS_SIZE" -gt 650 ]; then
            echo "::error::JavaScript bundle size (${JS_SIZE}KB) exceeds 650KB limit!"
            exit 1
          fi

          echo "✅ Bundle size check passed (${TOTAL_SIZE}KB total)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.github/lighthouse/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
